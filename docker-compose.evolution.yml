# Evolution API + Postgres + Redis (setup oficial mínimo)
# Uso: docker compose -f docker-compose.evolution.yml up -d
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evolution
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  evolution:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-troque-esta-chave}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:postgres@postgres:5432/evolution?schema=public
      REDIS_URI: redis://redis:6379
      # Webhook global apontando para este MVP (troque pela URL pública via ngrok/túnel):
      # WEBHOOK_GLOBAL_URL: https://SEU-DOMINIO/webhook/evolution
      # WEBHOOK_GLOBAL_ENABLED: "true"
      # WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
