<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IA Imóveis — Painel</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{font-family:system-ui;margin:0;background:#f4f4f5}header{background:#111827;color:#fff;padding:14px 20px}main{max-width:1100px;margin:0 auto;padding:16px}section{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #eee;padding:6px;text-align:left}input,select,textarea,button{padding:8px;border-radius:6px;border:1px solid #ccc}button{background:#111827;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:#eee}.cfg{font-size:12px;opacity:.85}.cfg input{padding:4px;width:280px}</style>
<header><b>IA Imóveis</b> — DFImóveis • WImóveis • NetImóveis | <span id="total"></span><br><span class="cfg">Backend: <input id="apiBase" placeholder="https://seu-backend.onrender.com (vazio = mesma origem)"> <button onclick="setApi()">usar</button></span></header>
<main>
<section><h3>Nova análise</h3>
<input id="url" style="width:100%" placeholder="Cole o link do anúncio"><br><br>
<textarea id="texto" style="width:100%" rows="3" placeholder="Ou cole o texto: Ap 70m2 R$ 550 mil, aceita financiamento, escritura e habite-se ok"></textarea><br><br>
<button onclick="analisar()">Analisar e salvar</button> <span id="nova"></span></section>
<div class="grid">
<section><h3>Filtros + Histórico</h3>
<input id="q" placeholder="buscar..." oninput="carregar()">
<select id="fFonte" onchange="carregar()"><option value="">todas fontes</option><option>dfimoveis</option><option>wimoveis</option><option>netimoveis</option><option>manual</option></select>
<select id="fStatus" onchange="carregar()"><option value="">todos status</option><option>novo</option><option>analisado</option><option>visitado</option><option>proposta</option><option>fechado</option><option>descartado</option></select>
<label><input type="checkbox" id="fFin" onchange="carregar()"> financiáveis</label>
<label><input type="checkbox" id="fDoc" onchange="carregar()"> com escritura</label><br><br>
<button onclick="compararSel()">Comparar selecionados (2-3)</button>
<div id="hist"></div></section>
<section><h3>Comparador</h3><div id="comp">Selecione 2-3 no histórico.</div>
<h3>Funil CRM</h3><div id="funil"></div>
<h3>Média m² por bairro (base local)</h3><div id="medias"></div>
<h3>Alertas — abaixo da média</h3><div id="alertas"></div></section>
</div>
<section><h3>Legenda p/ cliente</h3><input id="legId" placeholder="id da análise" style="width:300px"> <button onclick="legenda()">Gerar legenda</button> <button onclick="valorizacao()">Previsão valorização</button><div id="leg"></div></section>
<section><h3>Monitor diário (watchlist)</h3>
<input id="wUrl" style="width:55%" placeholder="https://... busca salva"> <input id="wRot" style="width:25%" placeholder="rótulo"> <button onclick="wAdd()">Adicionar</button> <button onclick="mRun()">Rodar agora</button><div id="mon"></div></section>
<section><h3>Mapa de calor — R$/m² por bairro</h3><div id="map" style="height:320px"></div><div id="mapTab"></div></section>
</main>
<script>
// API_BASE: ?api= na URL (salva) > localStorage > mesma origem. Permite hospedar este HTML em PHP/HTML estático.
var API_BASE=(new URLSearchParams(location.search).get('api')||localStorage.getItem('corretor_api')||'').replace(/\/$/,'');
if(new URLSearchParams(location.search).get('api'))localStorage.setItem('corretor_api',API_BASE);
function setApi(){var v=document.getElementById('apiBase').value.trim().replace(/\/$/,'');localStorage.setItem('corretor_api',v);location.reload();}
document.getElementById('apiBase').value=API_BASE;
function api(p){return API_BASE+p;}
async function analisar(){
 const url=document.getElementById('url').value, texto=document.getElementById('texto').value;
 const r=await fetch(api('/api/analisar'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,texto})}).then(r=>r.json());
 document.getElementById('nova').innerHTML='<b>'+r.veredito+'</b> '+r.score+'/100 <span class=pill>'+r.id+'</span><pre>'+r.ficha+'</pre>';
 carregar();
}
async function carregar(){
 const p=new URLSearchParams({q:q.value,fonte:fFonte.value,status:fStatus.value,financiavel:fFin.checked?1:'',comEscritura:fDoc.checked?1:''});
 const h=await fetch(api('/api/historico?'+p)).then(r=>r.json());
 total.textContent=h.length+' análises';
 hist.innerHTML='<table><tr><th></th><th>Score</th><th>Veredito</th><th>R$/m²</th><th>Bairro</th><th>Status</th><th></th></tr>'+h.map(a=>'<tr><td><input type=checkbox class=sel value='+a.id+'></td><td><b>'+a.score+'</b></td><td>'+a.veredito+'</td><td>'+(a.extracao.preco_m2||'—')+'</td><td>'+(a.bairro||a.fonte)+'</td><td><select onchange="status_(\''+a.id+'\',this.value)">'+['novo','analisado','visitado','proposta','fechado','descartado'].map(s=>'<option '+(a.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><button onclick="legenda(\''+a.id+'\')">legenda</button></td></tr>').join('')+'</table>';
 const f=await fetch(api('/api/funil')).then(r=>r.json());
 funil.innerHTML=Object.entries(f).map(([k,v])=>'<span class=pill>'+k+': '+v+'</span>').join(' ');
 const m=await fetch(api('/api/medias')).then(r=>r.json());
 medias.innerHTML='<table>'+m.map(x=>'<tr><td>'+x.bairro+'</td><td>'+x.media+'</td><td>n='+x.qtd+'</td></tr>').join('')+'</table>';
 const al=await fetch(api('/api/alertas')).then(r=>r.json());
 alertas.innerHTML=al.length?al.map(a=>'<div>• <b>-'+a.desconto+'%</b> '+a.id.slice(-4)+' — '+a.score+'/100 '+(a.bairro||'')+'</div>').join(''):'Nenhum alerta ainda.';
}
async function status_(id,status){await fetch(api('/api/status'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});carregar();}
async function compararSel(){const ids=[...document.querySelectorAll('.sel:checked')].map(e=>e.value);const c=await fetch(api('/api/comparar?ids='+ids.join(','))).then(r=>r.json());comp.innerHTML=c.error||('<b>'+c.resumo+'</b><table>'+c.linhas.map(l=>'<tr><td>'+l.criterio+'</td>'+l.valores.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</table>');}
async function legenda(id){id=id||legId.value;const l=await fetch(api('/api/legenda'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}).then(r=>r.json());leg.innerHTML='<pre>'+(l.legenda||l.error)+'</pre><p>'+(l.hashtags||'')+'</p>';}
async function valorizacao(){const v=await fetch(api('/api/valorizacao?id='+legId.value)).then(r=>r.json());leg.innerHTML='<b>'+(v.classificacao||v.error)+'</b> '+(v.projecao12m_pct!=null?v.projecao12m_pct+'% em 12m (faixa '+v.faixa12m_pct+')':'')+'<ul>'+((v.motivos||[]).map(m=>'<li>'+m+'</li>').join(''))+'</ul><small>'+(v.aviso||'')+'</small>';}
async function wAdd(){await fetch(api('/api/watchlist'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:wUrl.value,rotulo:wRot.value})});wUrl.value='';monCarregar();}
async function wDel(id){await fetch(api('/api/watchlist?id='+id),{method:'DELETE'});monCarregar();}
async function mRun(){mon.innerHTML='rodando...';const r=await fetch(api('/api/monitor/run'),{method:'POST'}).then(r=>r.json());mon.innerHTML='<b>verificadas:</b> '+r.verificadas+' <b>novas:</b> '+r.novas+' <b>alertas:</b> '+r.alertas;carregar();monCarregar();}
async function monCarregar(){const w=await fetch(api('/api/watchlist')).then(r=>r.json());mon.innerHTML=w.map(x=>'<div>• '+x.rotulo+' <small>'+x.url+'</small> <button onclick="wDel(\''+x.id+'\')">x</button></div>').join('');}
async function mapaCarregar(){const d=await fetch(api('/api/mapa')).then(r=>r.json());mapTab.innerHTML='<table>'+d.map(x=>'<tr><td>'+x.bairro+'</td><td><b>'+x.media+'</b></td><td>n='+x.qtd+'</td></tr>').join('')+'</table>';if(window.L&&d.length){if(!window._map){window._map=L.map('map').setView([-15.79,-47.93],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(window._map);}d.forEach(x=>L.circle([x.lat,x.lng],{radius:600+x.qtd*300,color:x.media>10000?'red':x.media>8000?'orange':'green'}).addTo(window._map).bindPopup(x.bairro+': R$'+x.media+'/m² (n='+x.qtd+')'));}}
carregar();monCarregar();mapaCarregar();
</script>
