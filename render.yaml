services:
  - type: web
    name: corretor-ia-imoveis
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: corretor-ia-imoveis-db
          property: connectionString
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: corretor-ia-imoveis-db
    plan: starter
