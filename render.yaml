services:
  - type: web
    name: corretor-ia-imoveis
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      # Configure com a connection string PostgreSQL do Supabase (Dashboard > Connect).
      # Não use SUPABASE_API_KEY neste campo: o servidor usa pg/DATABASE_URL.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://hunhabumyokpvuddwvuv.supabase.co
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
